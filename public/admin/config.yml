backend:
  name: github
  repo: CyberGems/CyberGems.github.io
  branch: main
  # Login: "Sign In with Token" using a fine-grained PAT (no OAuth app, no
  # server needed). Create it at https://github.com/settings/tokens?type=beta
  # with access to this repo and Contents: Read and write. The token is stored
  # only in your browser's local storage. Only accounts with write access to
  # the repo can save.

site_url: https://cybergems.org
media_folder: public/screenshots
public_path: /screenshots

collections:
  - name: apps
    label: Apps
    label_singular: App
    folder: src/data/apps
    format: json
    extension: json
    create: true
    slug: '{{slug}}'
    summary: '{{emoji}} {{name}} — {{slug}}'
    editor:
      preview: false
    fields:
      - name: slug
        label: Slug
        widget: string
        hint: Lowercase id used in URLs and the GitHub repo name (e.g. cybersnap)
      - name: name
        label: Name
        widget: string
      - name: emoji
        label: Emoji
        widget: string
      - name: accent
        label: Accent color
        widget: color
        default: '#00F2FF'
      - name: stack
        label: Tech stack
        widget: string
      - name: license
        label: License
        widget: string
        default: GPLv3
      - name: tagline
        label: Tagline
        widget: object
        fields:
          - name: en
            label: English
            widget: string
          - name: es
            label: Español
            widget: string
      - name: description
        label: Description
        widget: object
        fields:
          - name: en
            label: English
            widget: text
          - name: es
            label: Español
            widget: text
      - name: features
        label: Features
        widget: list
        fields:
          - name: en
            label: English
            widget: string
          - name: es
            label: Español
            widget: string
      - name: repo
        label: Repo URL
        widget: string
      - name: wiki
        label: Wiki URL
        widget: string
        required: false
      - name: winget
        label: Winget package id
        widget: string
        required: false
      - name: screenshot
        label: Screenshot
        widget: file
        required: false
        hint: Leave empty to show the gradient placeholder
