backend:
  name: github
  repo: CyberGems/CyberGems.github.io
  branch: main
  # Login: "Sign In with Token" using a fine-grained PAT (no OAuth app, no
  # server needed). Create it at https://github.com/settings/tokens?type=beta
  # with access to this repo and Contents: Read and write. The token is stored
  # only in your browser's local storage. Only accounts with write access to
  # the repo can save.

site_url: https://cybergems.org
media_folder: public/screenshots
public_path: /screenshots

collections:
  - name: apps
    label: Apps
    label_singular: App
    folder: src/data/apps
    format: json
    extension: json
    create: true
    slug: '{{slug}}'
    summary: '{{emoji}} {{name}} — {{slug}}'
    editor:
      preview: false
    fields:
      - name: slug
        label: Slug
        widget: string
        hint: Lowercase id used in URLs and the GitHub repo name (e.g. cybersnap)
      - name: name
        label: Name
        widget: string
      - name: emoji
        label: Emoji
        widget: string
      - name: accent
        label: Accent color
        widget: color
        default: '#00F2FF'
      - name: stack
        label: Tech stack
        widget: string
      - name: license
        label: License
        widget: string
        default: GPLv3
      - name: tagline
        label: Tagline
        widget: object
        fields:
          - name: en
            label: English
            widget: string
          - name: es
            label: Español
            widget: string
      - name: description
        label: Description
        widget: object
        fields:
          - name: en
            label: English
            widget: text
          - name: es
            label: Español
            widget: text
      - name: features
        label: Features
        widget: list
        fields:
          - name: en
            label: English
            widget: string
          - name: es
            label: Español
            widget: string
      - name: repo
        label: Repo URL
        widget: string
      - name: useCases
        label: Use cases (By Role / By Task)
        widget: object
        required: false
        fields:
          - name: roles
            label: By Role
            widget: list
            required: false
            fields:
              - { name: icon, label: Icon, widget: string }
              - name: title
                label: Title
                widget: object
                fields:
                  - { name: en, label: English, widget: string }
                  - { name: es, label: Español, widget: string }
              - name: text
                label: Text
                widget: object
                fields:
                  - { name: en, label: English, widget: text }
                  - { name: es, label: Español, widget: text }
          - name: tasks
            label: By Task
            widget: list
            required: false
            fields:
              - { name: icon, label: Icon, widget: string }
              - name: title
                label: Title
                widget: object
                fields:
                  - { name: en, label: English, widget: string }
                  - { name: es, label: Español, widget: string }
              - name: text
                label: Text
                widget: object
                fields:
                  - { name: en, label: English, widget: text }
                  - { name: es, label: Español, widget: text }
      - name: wiki
        label: Wiki URL
        widget: string
        required: false
      - name: winget
        label: Winget package id
        widget: string
        required: false
      - name: screenshot
        label: Screenshot
        widget: file
        required: false
        hint: Leave empty to show the gradient placeholder

  - name: faqs
    label: '❓ FAQs'
    files:
      - name: faqs
        label: Questions & answers (EN/ES)
        file: src/data/faqs.json
        fields:
          - name: en
            label: English
            widget: list
            fields:
              - { name: q, label: Question, widget: string }
              - { name: a, label: Answer, widget: text }
          - name: es
            label: Español
            widget: list
            fields:
              - { name: q, label: Pregunta, widget: string }
              - { name: a, label: Respuesta, widget: text }

  - name: settings
    label: '⚙️ Settings'
    files:
      - name: site
        label: Site & donations
        file: src/data/site.json
        fields:
          - { name: sponsors, label: GitHub Sponsors URL, widget: string }
          - { name: paypal, label: PayPal URL, widget: string, required: false }
          - { name: kofi, label: Ko-fi URL, widget: string, required: false }
          - { name: bmc, label: Buy Me a Coffee URL, widget: string, required: false }
          - name: crypto
            label: Crypto addresses
            widget: list
            fields:
              - { name: label, label: Asset, widget: string }
              - { name: network, label: Network, widget: string, required: false }
              - { name: address, label: Address, widget: string }
              - { name: qr, label: QR image, widget: image, required: false, hint: 'Stored path, e.g. /donate/qr-btc.png' }
              - { name: icon, label: Coin icon, widget: image, required: false, hint: 'Stored path, e.g. /donate/btc.svg' }

  - name: ui
    label: '🌐 UI Strings'
    files:
      - name: ui
        label: Nav, hero, footer (EN/ES)
        file: src/data/ui.json
        fields:
          - name: en
            label: English
            widget: object
            fields:
              - { name: tagline, widget: string }
              - { name: navApps, widget: string }
              - { name: navGitHub, widget: string }
              - { name: heroBadge, widget: string }
              - { name: heroTitle1, widget: string }
              - { name: heroTitle2, widget: string }
              - { name: heroText, widget: text }
              - { name: heroCta, widget: string }
              - { name: heroCta2, widget: string }
              - { name: stripFree, widget: string }
              - { name: stripNoAds, widget: string }
              - { name: stripNoTrack, widget: string }
              - { name: stripOss, widget: string }
              - { name: appsTitle, widget: string }
              - { name: appsSubtitle, widget: string }
              - { name: featuresTitle, widget: string }
              - { name: downloadCta, widget: string }
              - { name: releasesCta, widget: string }
              - { name: repoCta, widget: string }
              - { name: wikiCta, widget: string }
              - { name: backHome, widget: string }
              - { name: shotPlaceholder, widget: string }
              - { name: wingetHint, widget: string }
              - { name: madeBy, widget: string }
              - { name: langSwitch, widget: string }
              - { name: navChangelog, widget: string }
              - { name: navDownload, widget: string }
              - { name: navAbout, widget: string }
              - { name: navFaq, widget: string }
              - { name: navDonate, widget: string }
              - { name: changelogTitle, widget: string }
              - { name: changelogSubtitle, widget: string }
              - { name: changelogError, widget: text }
              - { name: viewOnGitHub, widget: string }
              - { name: navDocs, widget: string }
              - { name: footerTagline, widget: string }
              - { name: footerExplore, widget: string }
              - { name: footerResources, widget: string }
              - { name: footerProject, widget: string }
              - { name: docsTitle, widget: string }
              - { name: docsSubtitle, widget: string }
              - { name: docsUnavailable, widget: text }
              - { name: docsOpen, widget: string }
              - { name: docsSource, widget: text }
          - name: es
            label: Español
            widget: object
            fields:
              - { name: tagline, widget: string }
              - { name: navApps, widget: string }
              - { name: navGitHub, widget: string }
              - { name: heroBadge, widget: string }
              - { name: heroTitle1, widget: string }
              - { name: heroTitle2, widget: string }
              - { name: heroText, widget: text }
              - { name: heroCta, widget: string }
              - { name: heroCta2, widget: string }
              - { name: stripFree, widget: string }
              - { name: stripNoAds, widget: string }
              - { name: stripNoTrack, widget: string }
              - { name: stripOss, widget: string }
              - { name: appsTitle, widget: string }
              - { name: appsSubtitle, widget: string }
              - { name: featuresTitle, widget: string }
              - { name: downloadCta, widget: string }
              - { name: releasesCta, widget: string }
              - { name: repoCta, widget: string }
              - { name: wikiCta, widget: string }
              - { name: backHome, widget: string }
              - { name: shotPlaceholder, widget: string }
              - { name: wingetHint, widget: string }
              - { name: madeBy, widget: string }
              - { name: langSwitch, widget: string }
              - { name: navChangelog, widget: string }
              - { name: navDownload, widget: string }
              - { name: navAbout, widget: string }
              - { name: navFaq, widget: string }
              - { name: navDonate, widget: string }
              - { name: changelogTitle, widget: string }
              - { name: changelogSubtitle, widget: string }
              - { name: changelogError, widget: text }
              - { name: viewOnGitHub, widget: string }
              - { name: navDocs, widget: string }
              - { name: footerTagline, widget: string }
              - { name: footerExplore, widget: string }
              - { name: footerResources, widget: string }
              - { name: footerProject, widget: string }
              - { name: docsTitle, widget: string }
              - { name: docsSubtitle, widget: string }
              - { name: docsUnavailable, widget: text }
              - { name: docsOpen, widget: string }
              - { name: docsSource, widget: text }

  - name: pages
    label: '📄 Pages'
    files:
      - name: pages
        label: 'About, Privacy & Download (EN/ES)'
        file: src/data/pages.json
        fields:
          - name: about
            label: About
            widget: object
            fields:
              - name: en
                label: English
                widget: object
                fields:
                  - { name: metaTitle, widget: string }
                  - { name: metaDesc, widget: text }
                  - { name: badge, widget: string }
                  - { name: title, widget: string }
                  - { name: intro, widget: text }
                  - { name: isTitle, widget: string }
                  - { name: yesLabel, widget: string }
                  - { name: yesItems, label: 'Yes list', widget: list }
                  - { name: noLabel, widget: string }
                  - { name: noItems, label: 'No list', widget: list }
                  - { name: privacyNote, widget: text }
                  - { name: principlesTitle, widget: string }
                  - name: principles
                    widget: list
                    fields:
                      - { name: icon, label: Icon, widget: string }
                      - { name: t, label: Title, widget: string }
                      - { name: d, label: Text, widget: text }
                  - { name: exploreCta, widget: string }
                  - { name: donateCta, widget: string }
              - name: es
                label: Español
                widget: object
                fields:
                  - { name: metaTitle, widget: string }
                  - { name: metaDesc, widget: text }
                  - { name: badge, widget: string }
                  - { name: title, widget: string }
                  - { name: intro, widget: text }
                  - { name: isTitle, widget: string }
                  - { name: yesLabel, widget: string }
                  - { name: yesItems, label: 'Lista sí', widget: list }
                  - { name: noLabel, widget: string }
                  - { name: noItems, label: 'Lista no', widget: list }
                  - { name: privacyNote, widget: text }
                  - { name: principlesTitle, widget: string }
                  - name: principles
                    widget: list
                    fields:
                      - { name: icon, label: Icono, widget: string }
                      - { name: t, label: Título, widget: string }
                      - { name: d, label: Texto, widget: text }
                  - { name: exploreCta, widget: string }
                  - { name: donateCta, widget: string }
          - name: privacy
            label: Privacy
            widget: object
            fields:
              - name: en
                label: English
                widget: object
                fields:
                  - { name: metaTitle, widget: string }
                  - { name: metaDesc, widget: text }
                  - { name: subtitle, widget: text }
                  - { name: appsTitle, widget: string }
                  - { name: appsItems, label: Apps bullets, widget: list }
                  - { name: siteTitle, widget: string }
                  - { name: siteItems, label: Site bullets, widget: list }
                  - { name: signTitle, widget: string }
                  - { name: signText, widget: text }
              - name: es
                label: Español
                widget: object
                fields:
                  - { name: metaTitle, widget: string }
                  - { name: metaDesc, widget: text }
                  - { name: subtitle, widget: text }
                  - { name: appsTitle, widget: string }
                  - { name: appsItems, label: Bullets apps, widget: list }
                  - { name: siteTitle, widget: string }
                  - { name: siteItems, label: Bullets sitio, widget: list }
                  - { name: signTitle, widget: string }
                  - { name: signText, widget: text }
          - name: download
            label: Download
            widget: object
            fields:
              - name: en
                label: English
                widget: object
                fields:
                  - { name: metaTitle, widget: string }
                  - { name: metaDesc, widget: text }
                  - { name: pageTitle, widget: string }
                  - { name: subtitle, widget: text }
                  - { name: m1Title, widget: string }
                  - { name: m1Text, widget: text }
                  - { name: m2Title, widget: string }
                  - { name: m2Text, widget: text }
                  - { name: m3Note, widget: text }
                  - { name: reqStack, widget: text }
                  - { name: signText, widget: text }
                  - { name: allTitle, widget: string }
                  - { name: dlLink, widget: string }
                  - { name: relLink, widget: string }
              - name: es
                label: Español
                widget: object
                fields:
                  - { name: metaTitle, widget: string }
                  - { name: metaDesc, widget: text }
                  - { name: pageTitle, widget: string }
                  - { name: subtitle, widget: text }
                  - { name: m1Title, widget: string }
                  - { name: m1Text, widget: text }
                  - { name: m2Title, widget: string }
                  - { name: m2Text, widget: text }
                  - { name: m3Note, widget: text }
                  - { name: reqStack, widget: text }
                  - { name: signText, widget: text }
                  - { name: allTitle, widget: string }
                  - { name: dlLink, widget: string }
                  - { name: relLink, widget: string }
